name: Scalper Digest

on:
  schedule:
    - cron: "0 * * * *"          # hourly
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore per-channel timers and poll everything"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional - only needed if GitHub's datacenter IP gets blocked
          # by YouTube, which is likely without one of these.
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
          YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
          # Optional notification channels
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: python run.py ${{ inputs.force && '--force' || '' }}

      - name: Commit results
        run: |
          git config user.name  "scalper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Digest $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
